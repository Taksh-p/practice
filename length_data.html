<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Dynamic Roads Table</title>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    <style>
        /* Custom style for the footer row */
        #roadrepoort tfoot tr {
            background-color: #ff1d1d;
            /* Red background */
            font-weight: bold;
            color: white;
            /* White text */
            border-top: 2px solid #b30000;
        }

        #roadrepoort tfoot th {
            padding: 10px;
            text-align: left;
        }

        #roadrepoort tfoot th:last-child {
            color: white;
            /* Keep it white like the rest */
        }
    </style>

    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
</head>

<body>

    <h2>Roads Table</h2>

    <table id="roadrepoort" class="display" style="width:100%"></table>

    <script>
        $(document).ready(function () {
            const pageSize = 10;
            const currentPage = 1;

            const customColumns = [
                { title: "Id", data: "id" },
                { title: "Name", data: "name" },
                { title: "Type", data: "type" },
                { title: "Lane", data: "lane" }
            ];

            function loadData(page) {
                $.ajax({
                    url: `http://localhost:9090/api/roads?page=${page}&size=${pageSize}`,
                    method: 'GET',
                    success: function (response) {
                        const data = response.data;
                        if (!data || data.length === 0) return;

                        const laneTotal = data.reduce((sum, row) => sum + (parseInt(row.lane) || 0), 0);

                        let thead = '<thead><tr>';
                        customColumns.forEach(col => {
                            thead += `<th>${col.title}</th>`;
                        });
                        thead += '</tr></thead>';

                        let tfoot = '<tfoot><tr>';
                        tfoot += '<th colspan="2">Total Lane:</th>';
                        for (let i = 2; i < customColumns.length; i++) {
                            if (customColumns[i].data === 'lane') {
                                tfoot += `<th>${laneTotal}</th>`;
                            } else {
                                tfoot += '<th></th>';
                            }
                        }
                        tfoot += '</tr></tfoot>';

                        $('#roadrepoort').html(thead + '<tbody></tbody>' + tfoot);

                        $('#roadrepoort').DataTable({
                            data: data,
                            columns: customColumns,
                            searching: false,
                            paging: false,
                            info: false,
                            destroy: true
                        });
                    }
                });
            }

            loadData(currentPage);
        });
    </script>

</body>

</html>
